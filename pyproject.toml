[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "design-extractor-mcp"
version = "1.2.0"
description = "Model Context Protocol (MCP) Server & CLI for web design system reverse engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "JhonnyCCM" }
]
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "playwright>=1.40.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tomlkit>=0.13.0"
]

[project.scripts]
design-extractor = "cli:main"

[tool.setuptools]
py-modules = [
    "cli",
    "server",
    "core_extractor",
    "config_manager",
    "agent_integrator",
    "setup_wizard",
    "ui",
    "path_installer",
    "preset_manager",
    "storage",
    "system_checker",
    "updater"
]

